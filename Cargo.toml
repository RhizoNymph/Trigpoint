[workspace]
resolver = "3"
members = ["crates/*"]
# triglint links rustc_private and pins its own nightly; examples are
# integration targets linted from outside. Both are standalone workspaces.
exclude = ["triglint", "examples"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/RhizoNymph/trigpoint"
