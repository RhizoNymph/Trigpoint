[package]
name = "triglint"
version = "0.1.0"
description = "Dylint lints enforcing the trigpoint deterministic-simulation contract"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
dylint_linting = "6.0.1"
serde = { version = "1.0.219", features = ["derive"] }
thiserror = "2.0.12"
toml = "0.8.23"

[dev-dependencies]
dylint_testing = "6.0.1"

[workspace]

[package.metadata.rust-analyzer]
rustc_private = true
