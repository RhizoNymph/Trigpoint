[package]
name = "trigpoint"
description = "A WIP tool for creating a spec and a test harness that ensures that your code conforms to the spec through different categories of testing and formal methods"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true

[[bin]]
name = "trigp"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.40", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
trigpoint-core = { path = "../trigpoint-core" }
